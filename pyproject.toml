[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"
[project]
name = "ddas-deduplication"
version = "0.1.0"
description = "Download duplicate detection using streaming hashes and SQLite"
requires-python = ">=3.10"
dependencies = ["cryptography>=42"]
[project.optional-dependencies]
test = ["pytest>=8"]
[project.scripts]
ddas = "ddas.cli:main"
[tool.setuptools.packages.find]
where = ["src"]
